plugins {
    id 'com.android.application'
}

android {
    namespace 'com.steve.cdmap'
    compileSdk 35

    defaultConfig {
        applicationId 'com.steve.cdmap'
        minSdk 24
        targetSdk 34
        versionCode 6
        versionName '1.5'
    }

    // fixed signing key kept in this repo so new builds install over old ones (your progress is kept)
    signingConfigs {
        release {
            storeFile file('cdmap.keystore')
            storePassword 'cdmap-pass'
            keyAlias 'cdmap'
            keyPassword 'cdmap-pass'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
